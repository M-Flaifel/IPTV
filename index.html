<!doctype html>
<html lang="en" data-theme="classic-guide" data-input-mode="mouse">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1a2b" />
    <!-- Empty data-URI icon: keeps the browser from requesting /favicon.ico,
         which 404s in dev and inside the TV shell. -->
    <link rel="icon" href="data:," />
    <title>Flaifel's Entertainment</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash of the default.
      (function () {
        try {
          var themeColors = {
            'classic-guide': '#0b1a2b',
            'paper-guide': '#f4efe4',
            ember: '#17100d',
            'midnight-oled': '#000000',
            'modern-glass': '#0f1420',
            'high-contrast': '#000000',
          };
          var theme = localStorage.getItem('iptv-theme');
          if (
            theme &&
            Object.prototype.hasOwnProperty.call(themeColors, theme)
          ) {
            document.documentElement.setAttribute('data-theme', theme);
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) {
              meta.setAttribute('content', themeColors[theme]);
            }
          }
        } catch (error) {
          // Storage unavailable: keep the default theme.
        }
      })();
    </script>
    <script>
      // Phones and tablets start in Touch mode; keyboard/remote takes over on
      // the first keydown.
      (function () {
        try {
          if (
            window.matchMedia &&
            window.matchMedia('(pointer: coarse)').matches
          ) {
            document.documentElement.setAttribute('data-input-mode', 'touch');
          }
        } catch (error) {
          // Keep the default Mouse mode.
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
